<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFD Chat — ask the database</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e;
  --muted: #898781; --border: rgba(11,11,11,0.10); --series-1: #2a78d6; --hover-wash: rgba(11,11,11,0.05);
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #fff;
    --text-secondary: #c3c2b7; --muted: #898781; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --hover-wash: rgba(255,255,255,0.06); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 64px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 20px; }
form { display: flex; gap: 8px; margin-bottom: 20px; }
input[type="text"] { flex: 1; font: inherit; padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--surface-1); color: var(--text-primary); }
button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--series-1);
  background: var(--series-1); color: white; cursor: pointer; }
button:disabled { opacity: 0.5; cursor: default; }
.exchange { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px;
  background: var(--surface-1); }
.question { font-weight: 600; margin-bottom: 8px; }
pre.sql { background: var(--hover-wash); padding: 8px 10px; border-radius: 6px; overflow-x: auto;
  font-size: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); }
.error { color: #cc4444; }
.note { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>BFD Chat</h1>
  <p class="sub">Ask a question about the 11-genome comparative dataset. The generated SQL is
    always shown so you can verify it before trusting the answer. Read-only: only SELECT/WITH
    queries reach the database.</p>
  <form id="ask-form">
    <input type="text" id="question" placeholder="e.g. which species has the most CAZy families?" autofocus>
    <button type="submit" id="ask-btn">Ask</button>
  </form>
  <div id="history"></div>
</div>
<script>
const form = document.getElementById('ask-form');
const input = document.getElementById('question');
const btn = document.getElementById('ask-btn');
const history = document.getElementById('history');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  btn.disabled = true;
  const box = document.createElement('div');
  box.className = 'exchange';
  box.innerHTML = `<div class="question">${escapeHtml(question)}</div><p class="note">thinking...</p>`;
  history.prepend(box);
  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question}),
    });
    const data = await res.json();
    if (!res.ok) {
      box.innerHTML = `<div class="question">${escapeHtml(question)}</div><p class="error">${escapeHtml(data.detail || 'request failed')}</p>`;
      return;
    }
    let html = `<div class="question">${escapeHtml(question)}</div><pre class="sql">${escapeHtml(data.sql)}</pre>`;
    if (data.rows.length === 0) {
      html += '<p class="note">no rows returned</p>';
    } else {
      html += '<table><thead><tr>' + data.columns.map(c => `<th>${escapeHtml(c)}</th>`).join('') + '</tr></thead><tbody>';
      data.rows.forEach(row => {
        html += '<tr>' + row.map(v => `<td>${v === null ? '' : escapeHtml(String(v))}</td>`).join('') + '</tr>';
      });
      html += '</tbody></table>';
      if (data.truncated) html += `<p class="note">truncated to ${data.rows.length} rows</p>`;
    }
    box.innerHTML = html;
  } catch (err) {
    box.innerHTML = `<div class="question">${escapeHtml(question)}</div><p class="error">${escapeHtml(String(err))}</p>`;
  } finally {
    btn.disabled = false;
    input.value = '';
    input.focus();
  }
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
